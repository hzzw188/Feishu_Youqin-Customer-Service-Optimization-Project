name: Deploy

# 后端：推送到 master 时触发 Railway 自动部署（Railway 连接 GitHub 自动构建）
# 前端：推送到 master 时构建并部署到 Cloudflare Pages

on:
  push:
    branches: [master]

jobs:
  # ========== Railway 后端自动部署 ==========
  # Railway 已连接此 GitHub 仓库，推送后自动检测 railway.json 并构建部署
  # 无需额外 GitHub Actions 步骤，以下仅做健康检查通知

  # ========== Cloudflare Pages 前端部署 ==========
  deploy-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: cd frontend && npm ci

      - name: Build
        run: cd frontend && npm run build
        env:
          # Railway 后端地址（用户部署后需替换为自己的 Railway URL）
          VITE_API_BASE: https://ample-trust-production-d7ba.up.railway.app/api

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=youqin-cs --branch=master